server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses or error pages
    server_tokens off;

    # ── SECURITY HEADERS ──
    # always = send these on error responses (404 etc.) too, not just 2xx/3xx.
    #
    # The CSP is strict: everything comes from this origin, and the two inline
    # <script> blocks in index.html plus the inline <style> block in qr.html are
    # allowed by hash rather than by 'unsafe-inline'. Editing any of those blocks
    # — even by a single character of whitespace — changes its hash and the
    # browser will refuse to run it. Recompute with:
    #   openssl dgst -sha256 -binary <block> | openssl base64
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-78YgqAyZ2SVi23S7ltwXe/E7HlmpkZimYwZxUuKBSS4=' 'sha256-51aMzfAEHAE0QdGogXVbs7TaUH64Bi1vJfQCNOh59uI='; style-src 'self' 'sha256-yNX3a8rm3VqX/SDikoa1gjCptClc4vZVqODqN1KerV8='; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # frame-ancestors above covers modern browsers; this is the legacy equivalent
    add_header X-Frame-Options "DENY" always;

    # HSTS. TLS terminates at the ingress, so this only takes effect on the
    # https:// responses that reach a browser. No preload directive — that is a
    # one-way door and needs a deliberate submission to hstspreload.org.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Let browsers hold the fonts for a week. Uses `expires` rather than
    # add_header Cache-Control — an add_header inside a location block replaces
    # every header inherited from the server block, which would silently strip
    # the security headers above off font responses. `expires` doesn't.
    location ~* \.woff2$ {
        expires 7d;
    }

    # /qr resolves to qr.html
    location = /qr {
        try_files /qr.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
