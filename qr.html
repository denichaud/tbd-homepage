<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TBD &#8212; Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TBD &#8212; strategic consulting. Connect with &#201;mile Denichaud.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      gap: 1.5rem;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem 1.75rem 2rem;
      text-align: center;
    }

    .card-logo {
      display: flex;
      justify-content: center;
      text-decoration: none;
      margin-bottom: 0.5rem;
    }
    .card-logo:focus-visible { outline: 2px solid var(--accent); border-radius: 2px; }

    .card-logo-img {
      height: 36px;
      width: auto;
      max-width: 110px;
      display: block;
      margin: 0 auto;
    }

    .card-tagline {
      font-size: 0.8125rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .card-rule {
      height: 1px;
      background: var(--border);
      margin: 1.75rem 0;
    }

    .card-wit {
      font-size: 0.9375rem;
      color: var(--text);
      font-style: italic;
      font-weight: 300;
      line-height: 1.5;
      margin-bottom: 0.625rem;
    }

    .card-intro {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }

    /* ── WhatsApp CTA — primary ── */
    .wa-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      width: 100%;
      padding: 1rem 1.5rem;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      font-family: var(--font);
      text-decoration: none;
      transition: background 0.18s;
    }
    .wa-cta:hover,
    .wa-cta:focus-visible {
      background: #1eba57;
      outline: none;
    }
    .wa-cta svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ── Secondary links ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      text-align: left;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8125rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.18s, background 0.18s;
    }
    .link-btn:hover  { border-color: var(--accent); background: #FBF9F7; }
    .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .link-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-icon svg { width: 16px; height: 16px; display: block; }

    .icon-li { background: #EEF4FF; color: #0077B5; }
    .icon-ig { background: #FEF0F8; color: #C13584; }

    .link-text   { flex: 1; min-width: 0; }
    .link-name {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.3;
    }
    .link-sub {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .link-arrow {
      color: var(--muted);
      flex-shrink: 0;
      font-size: 0.875rem;
    }

    /* ── Page footer ── */
    .page-footer {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
    .page-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .page-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <a href="/" class="card-logo" aria-label="TBD home">
      <img src="logo.svg" alt="TBD" class="card-logo-img">
    </a>
    <p class="card-tagline">Future Planner</p>

    <div class="card-rule" role="separator"></div>

    <p class="card-wit">Great things have small beginnings.</p>
    <p class="card-intro">

      I&#8217;d be pleased to continue it with you.

  </div>

  <footer class="page-footer">
    <a href="/">tbd.to</a> &middot; Future Planner
  </footer>

</body>
</html>
